<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kotoba Beat</title>
  <meta name="description" content="Personal Japanese study: spaced review garden, story, particles, kanji, rhythm, pitch accent and speaking games.">
  <meta name="theme-color" content="#fbf7f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120f1c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#120f1c">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kotoba Beat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <button id="back" class="iconbtn" aria-label="Back" title="Back (Esc)" hidden>‹</button>
    <span id="title" class="topbar-title">Kotoba Beat</span>
    <span class="spacer"></span>
    <span id="quiet-badge" class="tag" hidden>🤫 quiet</span>
    <button id="slow-toggle" class="iconbtn slow-toggle" aria-pressed="false">🐢</button>
    <button id="ruby-toggle" class="iconbtn ruby-toggle" lang="ja" data-noruby>ふa</button>
  </header>
  <nav id="tabs" class="tabbar" aria-label="Main" data-noruby>
    <a class="tab" href="#/" data-tab="today"><span class="tab-k" lang="ja" aria-hidden="true">今</span><span>Today</span></a>
    <a class="tab" href="#/modes" data-tab="modes"><span class="tab-k" lang="ja" aria-hidden="true">技</span><span>Modes</span></a>
    <a class="tab" href="#/garden" data-tab="garden"><span class="tab-k" lang="ja" aria-hidden="true">庭</span><span>Garden</span></a>
    <a class="tab" href="#/progress" data-tab="progress"><span class="tab-k" lang="ja" aria-hidden="true">道</span><span>Progress</span></a>
    <a class="tab" href="#/settings" data-tab="settings"><span class="tab-k" lang="ja" aria-hidden="true">設</span><span>Settings</span></a>
  </nav>
  <div id="banner" class="banner-wrap" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="fx" class="fx-layer" aria-hidden="true"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript><p style="padding:16px">Kotoba Beat needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
